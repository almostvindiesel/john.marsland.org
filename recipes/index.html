(function() {
  var parts = window.location.pathname.replace(/\/$/, '').split('/');
  var slug = parts[parts.length - 1];
  if (slug && slug !== 'index.html' && slug !== 'recipes') {
    window.location.replace('https://john.marsland.org/#' + slug + '-recipe');
  } else {
    window.location.replace('https://john.marsland.org/#recipes');
  }
})();
</script>
